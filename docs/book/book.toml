[book]
title = "StitchCAD"
description = "A parametric sewing CAD: construction-recipe designs, evidence-bearing factory profiles, and deterministic artifact release packages. This book is the public documentation surface — specifications, guides and reference — kept in lockstep with the code (see COMMIT.md)."
authors = ["The StitchCAD maintainers"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
git-repository-url = "https://github.com/rdje/stitchcad"

[output.html.search]
# Full chapter text remains indexed; each result opens its semantic chapter.
heading-split-level = 1
