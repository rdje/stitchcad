<!doctype html>
<meta charset="utf-8">
<title>Canvas spike</title>
<!-- G1-SLICE.13: ADR-0002's measurement for the two topologies a page can host. The numbers are measured here, from what
     the renderer actually drew, and the correctness answers come from sc-viewport through WebAssembly. -->
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="surface" width="1600" height="1000"></canvas>
<canvas id="labels" width="512" height="256" style="display:none"></canvas>
<script>
const WIDTH = 1600, HEIGHT = 1000, SEED = 7, FRAMES = 600;
const ZOOMS = [[1,100],[1,50],[1,20],[1,10],[1,5],[1,1],[5,1],[20,1],[40,1]];
const report = (body) => fetch("/result", {method: "POST", body: JSON.stringify(body)});

function percentile(values, share) {
  const sorted = [...values].sort((a, b) => a - b);
  return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * share))];
}

// Where the marker's dark pixels centre, from an RGBA buffer. Antialiasing makes this finer than one pixel.
function centroid(pixels, width, height, stride) {
  let total = 0, sumX = 0, sumY = 0;
  for (let y = 0; y < height; y += 1) {
    for (let x = 0; x < width; x += 1) {
      const dark = 255 - pixels[y * stride + x * 4 + 1];
      if (dark > 0) { total += dark; sumX += dark * (x + 0.5); sumY += dark * (y + 0.5); }
    }
  }
  return total === 0 ? null : [sumX / total, sumY / total];
}

class CanvasRenderer {
  async prepare(corpus) {
    this.corpus = corpus;
    this.context = document.getElementById("surface").getContext("2d");
    if (!this.context) throw Error("no 2D context");
  }
  transform(view) {
    this.context.setTransform(view.scale, 0, 0, view.scale, -view.x, -view.y);
  }
  async frame(view, finish = true) {
    const context = this.context;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = "white";
    context.fillRect(0, 0, WIDTH, HEIGHT);
    this.transform(view);
    context.strokeStyle = "black";
    context.lineWidth = 1 / view.scale;
    context.beginPath();
    for (const piece of this.corpus.pieces) {
      const o = piece.outline;
      context.moveTo(o[0], o[1]);
      for (let at = 2; at < o.length; at += 2) context.lineTo(o[at], o[at + 1]);
      context.closePath();
      const a = piece.annotations;
      for (let at = 8; at + 1 < a.length; at += 2) {
        context.moveTo(a[at], a[at + 1]);
        context.lineTo(a[at] + 4 / view.scale, a[at + 1] + 8 / view.scale);
      }
    }
    context.stroke();
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = "black";
    context.font = "12px sans-serif";
    this.corpus.pieces.forEach((piece, number) => {
      const a = piece.annotations;
      for (let at = 0; at < 8; at += 2) {
        context.fillText("P" + number + "." + at / 2, a[at] * view.scale - view.x, a[at + 1] * view.scale - view.y);
      }
    });
    // A canvas queues its work, and reading one pixel rasterizes only that pixel, so a frame is finished when the whole
    // picture can be read. Every renderer here pays for this same read, which no real frame needs.
    if (finish) context.getImageData(0, 0, WIDTH, HEIGHT);
  }
  async marker(view, worldX, worldY, radius) {
    const context = this.context;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = "white";
    context.fillRect(0, 0, WIDTH, HEIGHT);
    this.transform(view);
    context.fillStyle = "black";
    context.beginPath();
    context.arc(worldX, worldY, radius / view.scale, 0, Math.PI * 2);
    context.fill();
    const image = context.getImageData(0, 0, WIDTH, HEIGHT);
    return centroid(image.data, WIDTH, HEIGHT, WIDTH * 4);
  }
}

const SHADER = `
struct Uniforms { scale: f32, x: f32, y: f32, width: f32, height: f32 };
@group(0) @binding(0) var<uniform> u: Uniforms;
struct Out { @builtin(position) position: vec4f, @location(0) uv: vec2f };
fn place(pixel: vec2f) -> vec4f {
  return vec4f(pixel.x / u.width * 2.0 - 1.0, 1.0 - pixel.y / u.height * 2.0, 0.0, 1.0);
}
@vertex fn line(@location(0) world: vec2f) -> @builtin(position) vec4f {
  return place(vec2f(world.x * u.scale - u.x, world.y * u.scale - u.y));
}
@fragment fn ink() -> @location(0) vec4f { return vec4f(0.0, 0.0, 0.0, 1.0); }
@vertex fn glyph(@location(0) pixel: vec2f, @location(1) uv: vec2f) -> Out {
  return Out(place(pixel), uv);
}
@group(0) @binding(1) var atlas: texture_2d<f32>;
@group(0) @binding(2) var nearest: sampler;
@fragment fn sampled(input: Out) -> @location(0) vec4f {
  let alpha = textureSample(atlas, nearest, input.uv).a;
  return vec4f(0.0, 0.0, 0.0, alpha);
}`;

class WebGpuRenderer {
  async prepare(corpus) {
    this.corpus = corpus;
    if (!navigator.gpu) throw Error("no navigator.gpu");
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw Error("requestAdapter returned nothing");
    this.adapterInfo = adapter.info ? (adapter.info.vendor + " " + adapter.info.architecture) : "";
    const device = this.device = await adapter.requestDevice();
    device.lost.then((info) => report({failure: "device lost: " + info.message}));
    this.format = "bgra8unorm";
    const context = this.context = document.getElementById("surface").getContext("webgpu");
    if (!context) throw Error("no webgpu context");
    context.configure({device, format: this.format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC, alphaMode: "opaque"});
    this.multisample = device.createTexture({size: [WIDTH, HEIGHT], sampleCount: 4, format: this.format, usage: GPUTextureUsage.RENDER_ATTACHMENT});
    const module = device.createShaderModule({code: SHADER});
    this.uniforms = device.createBuffer({size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST});

    // Line vertices: every outline edge, and the annotations' short marks.
    const lines = [];
    for (const piece of corpus.pieces) {
      const o = piece.outline, count = o.length / 2;
      for (let at = 0; at < count; at += 1) {
        const next = (at + 1) % count;
        lines.push(o[at * 2], o[at * 2 + 1], o[next * 2], o[next * 2 + 1]);
      }
      const a = piece.annotations;
      for (let at = 8; at + 1 < a.length; at += 2) lines.push(a[at], a[at + 1], a[at] + 500, a[at + 1] + 1000);
    }
    this.lineCount = lines.length / 2;
    this.lineBuffer = device.createBuffer({size: lines.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST});
    device.queue.writeBuffer(this.lineBuffer, 0, new Float32Array(lines));
    this.markerBuffer = device.createBuffer({size: 6 * 8, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST});

    // The labels' text comes from a small atlas drawn once.
    const atlasCanvas = document.getElementById("labels");
    const atlasContext = atlasCanvas.getContext("2d");
    atlasContext.font = "12px sans-serif";
    atlasContext.fillStyle = "black";
    this.cells = [];
    corpus.pieces.forEach((piece, number) => {
      for (let at = 0; at < 4; at += 1) {
        const cell = this.cells.length, cellX = (cell % 8) * 64, cellY = Math.floor(cell / 8) * 16;
        atlasContext.fillText("P" + number + "." + at, cellX, cellY + 12);
        this.cells.push({cellX, cellY, worldX: piece.annotations[at * 2], worldY: piece.annotations[at * 2 + 1]});
      }
    });
    const atlas = device.createTexture({size: [512, 256], format: "rgba8unorm",
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT});
    device.queue.copyExternalImageToTexture({source: atlasCanvas}, {texture: atlas}, [512, 256]);
    this.glyphBuffer = device.createBuffer({size: this.cells.length * 6 * 16, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST});

    const layout = device.createBindGroupLayout({entries: [
      {binding: 0, visibility: GPUShaderStage.VERTEX, buffer: {type: "uniform"}},
      {binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: {}},
      {binding: 2, visibility: GPUShaderStage.FRAGMENT, sampler: {}},
    ]});
    this.bindGroup = device.createBindGroup({layout, entries: [
      {binding: 0, resource: {buffer: this.uniforms}},
      {binding: 1, resource: atlas.createView()},
      {binding: 2, resource: device.createSampler()},
    ]});
    const pipelineLayout = device.createPipelineLayout({bindGroupLayouts: [layout]});
    const shared = {layout: pipelineLayout, multisample: {count: 4}};
    const position = {arrayStride: 8, attributes: [{shaderLocation: 0, offset: 0, format: "float32x2"}]};
    const target = {format: this.format};
    this.linePipeline = device.createRenderPipeline({...shared,
      vertex: {module, entryPoint: "line", buffers: [position]},
      fragment: {module, entryPoint: "ink", targets: [target]},
      primitive: {topology: "line-list"}});
    this.fillPipeline = device.createRenderPipeline({...shared,
      vertex: {module, entryPoint: "line", buffers: [position]},
      fragment: {module, entryPoint: "ink", targets: [target]},
      primitive: {topology: "triangle-list"}});
    this.glyphPipeline = device.createRenderPipeline({...shared,
      vertex: {module, entryPoint: "glyph", buffers: [{arrayStride: 16, attributes: [
        {shaderLocation: 0, offset: 0, format: "float32x2"}, {shaderLocation: 1, offset: 8, format: "float32x2"}]}]},
      fragment: {module, entryPoint: "sampled", targets: [{...target, blend: {
        color: {srcFactor: "src-alpha", dstFactor: "one-minus-src-alpha"},
        alpha: {srcFactor: "one", dstFactor: "one-minus-src-alpha"}}}]},
      primitive: {topology: "triangle-list"}});
    this.readback = device.createBuffer({size: WIDTH * HEIGHT * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ});
  }
  setView(view) {
    this.device.queue.writeBuffer(this.uniforms, 0, new Float32Array([view.scale, view.x, view.y, WIDTH, HEIGHT, 0, 0, 0]));
  }
  pass(encoder, resolve) {
    return encoder.beginRenderPass({colorAttachments: [{view: this.multisample.createView(), resolveTarget: resolve,
      clearValue: {r: 1, g: 1, b: 1, a: 1}, loadOp: "clear", storeOp: "discard"}]});
  }
  async frame(view, finish = true) {
    this.setView(view);
    const glyphs = new Float32Array(this.cells.length * 24);
    this.cells.forEach((cell, index) => {
      const left = cell.worldX * view.scale - view.x, top = cell.worldY * view.scale - view.y - 12;
      const right = left + 64, bottom = top + 16;
      const u0 = cell.cellX / 512, v0 = cell.cellY / 256, u1 = (cell.cellX + 64) / 512, v1 = (cell.cellY + 16) / 256;
      glyphs.set([left,top,u0,v0, right,top,u1,v0, left,bottom,u0,v1, left,bottom,u0,v1, right,top,u1,v0, right,bottom,u1,v1], index * 24);
    });
    this.device.queue.writeBuffer(this.glyphBuffer, 0, glyphs);
    const encoder = this.device.createCommandEncoder();
    const texture = this.context.getCurrentTexture();
    const pass = this.pass(encoder, texture.createView());
    pass.setBindGroup(0, this.bindGroup);
    pass.setPipeline(this.linePipeline);
    pass.setVertexBuffer(0, this.lineBuffer);
    pass.draw(this.lineCount);
    pass.setPipeline(this.glyphPipeline);
    pass.setVertexBuffer(0, this.glyphBuffer);
    pass.draw(this.cells.length * 6);
    pass.end();
    // A frame is finished when the whole picture can be read, the same definition as the canvas renderer's.
    if (finish) encoder.copyTextureToBuffer({texture}, {buffer: this.readback, bytesPerRow: WIDTH * 4}, [WIDTH, HEIGHT]);
    this.device.queue.submit([encoder.finish()]);
    if (finish) {
      await this.readback.mapAsync(GPUMapMode.READ);
      this.readback.unmap();
    }
  }
  async marker(view, worldX, worldY, radius) {
    this.setView(view);
    const half = radius / view.scale;
    const [l, r, t, b] = [worldX - half, worldX + half, worldY - half, worldY + half];
    this.device.queue.writeBuffer(this.markerBuffer, 0, new Float32Array([l,t, r,t, l,b, l,b, r,t, r,b]));
    const encoder = this.device.createCommandEncoder();
    const texture = this.context.getCurrentTexture();
    const pass = this.pass(encoder, texture.createView());
    pass.setBindGroup(0, this.bindGroup);
    pass.setPipeline(this.fillPipeline);
    pass.setVertexBuffer(0, this.markerBuffer);
    pass.draw(6);
    pass.end();
    encoder.copyTextureToBuffer({texture}, {buffer: this.readback, bytesPerRow: WIDTH * 4}, [WIDTH, HEIGHT]);
    this.device.queue.submit([encoder.finish()]);
    await this.readback.mapAsync(GPUMapMode.READ);
    const pixels = new Uint8Array(this.readback.getMappedRange()).slice();
    this.readback.unmap();
    return centroid(pixels, WIDTH, HEIGHT, WIDTH * 4);
  }
}

async function main() {
  const topology = new URLSearchParams(location.search).get("topology");
  const started = performance.now();
  const wasm = await (await fetch("sc_viewer.wasm")).arrayBuffer();
  const {instance} = await WebAssembly.instantiate(wasm, {});
  const x = instance.exports;
  const big = (value) => BigInt(Math.round(value));
  x.sc_spike_load(SEED);
  const bytes = new Uint8Array(x.sc_output_len());
  for (let at = 0; at < bytes.length; at += 1) bytes[at] = x.sc_output_byte(at);
  const corpus = JSON.parse(new TextDecoder().decode(bytes));
  const view = () => ({scale: x.sc_view_scale(), x: x.sc_view_offset_x(), y: x.sc_view_offset_y()});

  const renderer = topology === "dom-canvas" ? new CanvasRenderer() : new WebGpuRenderer();
  await renderer.prepare(corpus);
  x.sc_view_new(1n, 5n);
  await renderer.frame(view());
  const coldStart = performance.now() - started;

  // The memory visit draws the same path as a screen would, with no read-backs, whose garbage would be measured otherwise.
  if (new URLSearchParams(location.search).get("mode") === "memory") {
    x.sc_view_new(1n, 5n);
    for (let frame = 0; frame < FRAMES; frame += 1) {
      const zoom = ZOOMS[Math.floor(frame / 20) % ZOOMS.length];
      x.sc_view_zoom_about(BigInt(zoom[0]), BigInt(zoom[1]), 800n, 500n);
      x.sc_view_pan(BigInt((frame % 40) - 20), BigInt((frame % 30) - 15));
      await renderer.frame(view(), false);
      await new Promise((resolve) => requestAnimationFrame(resolve));
    }
    await report({memory_done: true});
    return;
  }

  // Correctness: from the screen position the renderer would show, back to the world, to the corpus's answer.
  let pickRight = 0, snapRight = 0;
  x.sc_view_new(40n, 1n);
  const nearestPixel = (worldX, worldY) => [Math.round(x.sc_view_pixel_x(big(worldX), big(worldY))), Math.round(x.sc_view_pixel_y(big(worldX), big(worldY)))];
  for (const [worldX, worldY, piece, entity] of corpus.picks) {
    const [px, py] = nearestPixel(worldX, worldY);
    const back = [x.sc_view_point_x(BigInt(px), BigInt(py)), x.sc_view_point_y(BigInt(px), BigInt(py))];
    if (x.sc_spike_pick(back[0], back[1], 200n) === BigInt(piece * 100000 + entity)) pickRight += 1;
  }
  for (const [worldX, worldY, piece, entity] of corpus.snaps) {
    const [px, py] = nearestPixel(worldX, worldY);
    const back = [x.sc_view_point_x(BigInt(px), BigInt(py)), x.sc_view_point_y(BigInt(px), BigInt(py))];
    if (x.sc_spike_snap(back[0], back[1]) === BigInt(piece * 100000 + entity)) snapRight += 1;
  }

  // Fidelity: where the marker actually landed in the renderer's pixels, against the exact position.
  let worst = 0;
  const samples = corpus.picks.slice(0, 5);
  for (const zoom of ZOOMS) {
    for (const [worldX, worldY] of samples) {
      x.sc_view_new(BigInt(zoom[0]), BigInt(zoom[1]));
      const startX = x.sc_view_pixel_x(big(worldX), big(worldY)), startY = x.sc_view_pixel_y(big(worldX), big(worldY));
      x.sc_view_pan(big(startX - WIDTH / 2 - 0.37), big(startY - HEIGHT / 2 - 0.61));
      const wantX = x.sc_view_pixel_x(big(worldX), big(worldY)), wantY = x.sc_view_pixel_y(big(worldX), big(worldY));
      const found = await renderer.marker(view(), worldX, worldY, 6);
      if (found === null) throw Error("a marker drew nothing at zoom " + zoom);
      worst = Math.max(worst, Math.abs(found[0] - wantX), Math.abs(found[1] - wantY));
    }
  }

  // Drift: the renderer's own transform and its drawn marker after 1000 round trips of the ladder.
  const [probeX, probeY] = corpus.picks[0];
  x.sc_view_new(1n, 1n);
  x.sc_view_pan(big(x.sc_view_pixel_x(big(probeX), big(probeY)) - WIDTH / 2), big(x.sc_view_pixel_y(big(probeX), big(probeY)) - HEIGHT / 2));
  const before = view();
  const startMark = await renderer.marker(before, probeX, probeY, 6);
  for (let trip = 0; trip < 1000; trip += 1) {
    for (const zoom of [...ZOOMS, ...[...ZOOMS].reverse()]) x.sc_view_zoom_about(BigInt(zoom[0]), BigInt(zoom[1]), 400n, 300n);
    x.sc_view_zoom_about(1n, 1n, 400n, 300n);
  }
  const after = view();
  const endMark = await renderer.marker(after, probeX, probeY, 6);
  const drift = Math.max(Math.abs(after.x - before.x), Math.abs(after.y - before.y), Math.abs(after.scale - before.scale),
    startMark && endMark ? Math.abs(startMark[0] - endMark[0]) : 1e9, startMark && endMark ? Math.abs(startMark[1] - endMark[1]) : 1e9);

  // Frame time: a scripted zoom and pan over the whole corpus, timing the renderer's own finished work.
  const times = [];
  x.sc_view_new(1n, 5n);
  for (let frame = 0; frame < FRAMES; frame += 1) {
    const zoom = ZOOMS[Math.floor(frame / 20) % ZOOMS.length];
    x.sc_view_zoom_about(BigInt(zoom[0]), BigInt(zoom[1]), 800n, 500n);
    x.sc_view_pan(BigInt((frame % 40) - 20), BigInt((frame % 30) - 15));
    const begun = performance.now();
    await renderer.frame(view());
    times.push(performance.now() - begun);
  }

  await report({
    topology, capable: "yes",
    pick_correct: pickRight === corpus.picks.length && corpus.picks.length === 200 ? "yes" : "no",
    snap_exact: snapRight === corpus.snaps.length && corpus.snaps.length === 200 ? "yes" : "no",
    pick_right: pickRight, snap_right: snapRight,
    fidelity_max_px: worst, fidelity_drift_px: drift,
    frame_p95_ms: percentile(times, 0.95), frame_median_ms: percentile(times, 0.5), cold_start_ms: coldStart,
    wasm_bytes: wasm.byteLength, user_agent: navigator.userAgent, adapter: renderer.adapterInfo || "",
  });
}
main().catch((error) => report({failure: String(error)}));
</script>
