name: determinism
# The determinism policy of ROADMAP.md §13, enforced where it can fail: the same frozen bits, the same golden files and the same answers on
# every operating system. Each test below compares against a file in this repository, so a platform that rounds differently fails here by name.
on:
  push:
  pull_request:

jobs:
  same-bytes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: The same bytes on this operating system
        run: cargo test -p sc-units --test determinism -p sc-geometry --test offset_corpus --test metamorphic -p sc-cli --test skirt --test save_load --test mutants -p sc-viewer --test shell -p sc-artifacts --test dxf --test pdf
