name: rust
# The G0 CI shape required by ROADMAP.md §4.3 and §7.3: fmt, clippy at deny-warnings, the unit and
# property suites, and a REAL wasm32-unknown-unknown build of the crates the wasm-viewer profile
# depends on. §7.3 is explicit that browser-target compilation is tested for real, not with a host
# `cargo check` — a crate that only compiles natively is a capability-matrix claim nobody proved.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project-local build stores
        run: python3 -I -B scripts/ci_environment.py prepare
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown --no-self-update
      - name: Verify project-local build stores
        run: python3 -I -B scripts/ci_environment.py verify
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (unit + property + doc)
        run: cargo test --all
      - name: WASM smoketest (wasm-viewer profile foundations)
        run: |
          cargo build --target wasm32-unknown-unknown -p sc-units -p sc-core -p sc-measure
          ls -l target/wasm32-unknown-unknown/debug/*.rlib
