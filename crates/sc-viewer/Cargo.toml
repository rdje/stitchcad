[package]
name = "sc-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "StitchCAD wasm-viewer profile: runs a session in the browser against a project image."

[lib]
crate-type = ["cdylib", "rlib"]

# The workspace forbids unsafe code outright. A WebAssembly export needs `no_mangle`, which that lint also counts,
# so this crate denies it instead and allows it on the one module of exports. That module has no unsafe blocks.
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[dependencies]
sc-cli = { path = "../sc-cli", version = "0.1.0" }
sc-store = { path = "../sc-store", version = "0.1.0" }
sc-viewport = { path = "../sc-viewport", version = "0.1.0" }
