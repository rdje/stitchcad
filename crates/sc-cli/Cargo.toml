[package]
name = "sc-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "StitchCAD headless command line: deterministic session replay over the command bus."

[lints]
workspace = true

[[bin]]
name = "stitchcad"
path = "src/main.rs"

[dependencies]
sc-artifacts = { path = "../sc-artifacts", version = "0.1.0" }
sc-constraints = { path = "../sc-constraints", version = "0.1.0" }
sc-core = { path = "../sc-core", version = "0.1.0" }
sc-geometry = { path = "../sc-geometry", version = "0.1.0" }
sc-grading = { path = "../sc-grading", version = "0.1.0" }
sc-measure = { path = "../sc-measure", version = "0.1.0" }
sc-store = { path = "../sc-store", version = "0.1.0" }
sc-units = { path = "../sc-units", version = "0.1.0" }
