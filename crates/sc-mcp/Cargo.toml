[package]
name = "sc-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "StitchCAD's MCP server, local-stdio profile: the API's workflows as MCP tools, over process pipes."

[lints]
workspace = true

[[bin]]
name = "stitchcad-mcp"
path = "src/main.rs"

[dependencies]
sc-api = { path = "../sc-api", version = "0.1.0" }
sc-cli = { path = "../sc-cli", version = "0.1.0" }
sc-store = { path = "../sc-store", version = "0.1.0" }

[dev-dependencies]
sc-artifacts = { path = "../sc-artifacts", version = "0.1.0" }
