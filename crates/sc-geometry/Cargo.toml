[package]
name = "sc-geometry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "StitchCAD 2D kernel: lines, arcs and cubic Béziers in whole micrometres, with exact predicates."

[lints]
workspace = true

[dependencies]
sc-units = { path = "../sc-units", version = "0.1.0" }

[dev-dependencies]
# The tests' independent oracle, which shares no arithmetic with the kernel.
num-bigint = "=0.4.6"
# Reads the conformance corpus, which is canonical text.
sc-store = { path = "../sc-store", version = "0.1.0" }
